<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong · Kashyap Advisors</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; background: #f7f4ee; color: #1f2933; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(560px, 100%); padding: clamp(28px, 7vw, 64px); background: #fffdf9; border: 1px solid #e8e1d6; border-radius: 24px; box-shadow: 0 18px 50px rgb(45 39 30 / 10%); }
    .eyebrow { margin: 0 0 18px; color: #a4473b; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(32px, 7vw, 56px); line-height: 1; letter-spacing: -.04em; text-wrap: balance; }
    p { margin: 20px 0 28px; color: #66717b; line-height: 1.65; text-wrap: pretty; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    a { display: inline-flex; min-height: 44px; align-items: center; border-radius: 12px; padding: 0 18px; background: #1f2933; color: #fff; font-weight: 700; text-decoration: none; transition: background-color 150ms ease, transform 150ms ease; }
    a.secondary { background: transparent; color: #1f2933; box-shadow: inset 0 0 0 1px #cfc6b8; }
    a:hover { background: #354452; }
    a.secondary:hover { background: #f2ece2; }
    a:active { transform: scale(.96); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Kashyap Advisors · 500</p>
    <h1>Something went wrong.</h1>
    <p>Our team has been notified. Please try again in a moment, or return to the main site.</p>
    <div class="actions">
      <a href="/">Back to home</a>
      <a class="secondary" href="javascript:location.reload()">Try again</a>
    </div>
  </main>
</body>
</html>
